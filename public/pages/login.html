<!doctype html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoODS · Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/main.css">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/components/navbar.js"></script>
  <script defer src="/js/components/includeLoader.js"></script>
  <script type="module" src="/js/pages/loginPage.js"></script>
</head>
<body>
  <div data-include="/includes/navbar.html"></div>
  <main class="container pageContainer">
    <header class="pageHeader">
      <h1>Iniciar sessió</h1>
    </header>
    <section class="row justify-content-center">
      <div class="col-md-6 col-lg-4">
        <form id="loginForm" class="card cardFeature p-3">
          <p class="text-muted small">Accedeix per gestionar perfil, inscripcions i funcions segons el teu rol.</p>
          <label class="form-label" for="loginEmail">Email</label>
          <input class="form-control mb-3" type="email" id="loginEmail" required>
          <label class="form-label" for="loginPassword">Contrasenya</label>
          <input class="form-control mb-3" type="password" id="loginPassword" required>
          <button class="btn btn-primary" type="submit">Entrar</button>
        </form>
      </div>
    </section>
  </main>
  <div data-include="/includes/footer.html"></div>
</body>
</html>

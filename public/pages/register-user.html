<!doctype html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoODS · Registre Usuari</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/styles/main.css">
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="/js/components/navbar.js"></script>
  <script defer src="/js/components/includeLoader.js"></script>
  <script type="module" src="/js/pages/registerUserPage.js"></script>
</head>
<body>
  <div data-include="/includes/navbar.html"></div>
  <main class="container pageContainer">
    <header class="pageHeader">
      <h1>Registre d'usuari</h1>
      <p>Crea el teu compte per unir-te a events i col·laborar amb ONGs sostenibles.</p>
    </header>
    <section class="row justify-content-center">
      <div class="col-md-7 col-lg-5">
        <form id="registerUserForm" class="card cardFeature p-3">
          <label class="form-label" for="registerName">Nom</label>
          <input class="form-control mb-3" type="text" id="registerName" required>
          <label class="form-label" for="registerEmail">Email</label>
          <input class="form-control mb-3" type="email" id="registerEmail" required>
          <label class="form-label" for="registerPassword">Contrasenya</label>
          <input class="form-control mb-3" type="password" id="registerPassword" required>
          <label class="form-label" for="registerPasswordConfirm">Confirmar contrasenya</label>
          <input class="form-control mb-3" type="password" id="registerPasswordConfirm" required>
          <button class="btn btn-success" type="submit">Crear compte</button>
        </form>
      </div>
    </section>
  </main>
  <div data-include="/includes/footer.html"></div>
</body>
</html>
